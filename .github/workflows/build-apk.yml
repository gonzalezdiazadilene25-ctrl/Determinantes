name: Construir APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade buildozer "cython==3.0.11" setuptools
      - name: Compilar APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
      - name: Mostrar error de compilacion
        if: failure()
        run: |
          # Publica las ultimas lineas del log como anotacion (visible en la pagina del run)
          grep -n -i -E "error|exception|failed|traceback" build.log | grep -v -i warning | tail -40 > errores.txt || true
          tail -60 build.log > final.txt
          echo "::error title=Errores::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errores.txt)"
          echo "::error title=Final del log::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' final.txt)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: determinantes-apk
          path: bin/*.apk
