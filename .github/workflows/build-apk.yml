name: Construir APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
          pip install "buildozer==1.5.0" "cython==0.29.36" setuptools
      - name: Compilar APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
      - name: Mostrar error de compilacion
        if: failure()
        run: |
          # Publica las partes utiles del log como anotaciones (visibles en la pagina del run)
          sed 's/\x1b\[[0-9;]*m//g' build.log > limpio.log
          awk '/What went wrong|Try:|BUILD FAILED|Could not|requires Java/{f=1;n=0} f&&n++<25' limpio.log | head -60 > contexto.txt
          grep -E "error:|Error:|ERROR|Traceback|No such file|not found|fatal" limpio.log \
            | grep -v -E "noexcept|error code|performance hint|warning" | tail -40 > errores.txt || true
          publicar() {
            split -l 20 "$2" trozo_
            for t in trozo_*; do
              echo "::error title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$t")"
            done
            rm -f trozo_*
          }
          publicar Errores errores.txt
          publicar Contexto contexto.txt
      - name: Buscar el APK generado
        if: always()
        run: |
          mkdir -p salida
          find bin .buildozer -name "*.apk" -newer buildozer.spec -exec cp {} salida/ \; 2>/dev/null || true
          ls -la salida
          if ls salida/*.apk >/dev/null 2>&1; then echo "::notice title=APK::$(ls salida)"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: determinantes-apk
          path: salida/*.apk
          if-no-files-found: warn
